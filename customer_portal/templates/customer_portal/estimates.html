<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Estimates - {{ customer.name }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .btn { background: #6b7280; color: white; padding: 8px 16px; border: none; border-radius: 4px; text-decoration: none; display: inline-block; }
    table { width: 100%; background: white; border-radius: 8px; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { font-weight: 600; }
    .status { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <a href="{% url 'customer_portal:dashboard' %}" class="btn">← Back to Dashboard</a>
    <h1 style="margin: 20px 0 0 0;">My Estimates</h1>
  </div>
  
  <table>
    <thead>
      <tr>
        <th>Estimate #</th>
        <th>Date</th>
        <th>Total</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for estimate in estimates %}
        <tr>
          <td>#{{ estimate.id }}</td>
          <td>{{ estimate.created_at|date:"M d, Y" }}</td>
          <td>${{ estimate.total|floatformat:2 }}</td>
          <td><span class="status">{{ estimate.get_status_display }}</span></td>
          <td><a href="{% url 'customer_portal:estimate_detail' estimate.id %}">View</a></td>
        </tr>
      {% empty %}
        <tr><td colspan="5" style="text-align: center; padding: 40px;">No estimates found</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
