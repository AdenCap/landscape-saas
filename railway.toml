# Railway: startCommand runs at RUNTIME only. Do not run gunicorn in the build (causes port 8080 in use).
[build]
buildCommand = "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"

[deploy]
startCommand = "PYTHONPATH=. gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 1 --timeout 120"
