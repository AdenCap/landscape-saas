<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="#3b82f6"/>

  <!-- Abstract geometric design: overlapping squares rotated -->
  <!-- Outer square rotated 45deg -->
  <rect x="128" y="128" width="256" height="256" fill="none" stroke="white" stroke-width="24" transform="rotate(45 256 256)" opacity="0.9"/>

  <!-- Inner square rotated -45deg -->
  <rect x="160" y="160" width="192" height="192" fill="none" stroke="white" stroke-width="20" transform="rotate(-45 256 256)" opacity="0.7"/>

  <!-- Center accent circle -->
  <circle cx="256" cy="256" r="32" fill="white" opacity="0.8"/>

  <!-- Four corner dots for field/grid concept -->
  <circle cx="144" cy="144" r="12" fill="white" opacity="0.5"/>
  <circle cx="368" cy="144" r="12" fill="white" opacity="0.5"/>
  <circle cx="144" cy="368" r="12" fill="white" opacity="0.5"/>
  <circle cx="368" cy="368" r="12" fill="white" opacity="0.5"/>
</svg>
