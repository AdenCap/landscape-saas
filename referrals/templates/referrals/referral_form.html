{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>{{ action }} Referral</h1>
</div>

<div class="card">
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Referrer (Customer) *</label>
      <select name="referrer" required>
        <option value="">— Select Customer —</option>
        {% for customer in customers %}
          <option value="{{ customer.id }}">{{ customer.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Referred Name *</label>
      <input type="text" name="referred_name" required>
    </div>
    <div class="form-group">
      <label>Referred Email</label>
      <input type="email" name="referred_email">
    </div>
    <div class="form-group">
      <label>Referred Phone</label>
      <input type="text" name="referred_phone">
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea name="notes" rows="4"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'referrals:referral_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
