<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estimate Accepted</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; color: #1e293b; max-width: 480px; margin: 60px auto; padding: 24px; text-align: center; background: #f8fafc; }
    .card { background: #d1fae5; border: 2px solid #059669; border-radius: 16px; padding: 40px; }
    .doc-logo { margin-bottom: 20px; }
    .doc-logo img { max-height: 48px; max-width: 160px; object-fit: contain; }
    h1 { color: #065f46; margin: 0 0 12px 0; font-size: 28px; }
    p { margin: 0; color: #047857; font-size: 18px; }
    .total { font-size: 24px; font-weight: 700; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    {% if estimate.business.logo %}
    <div class="doc-logo"><img src="{{ estimate.business.logo.url }}" alt="{{ estimate.business.name }}"></div>
    {% endif %}
    <h1>Thank you!</h1>
    <p>You've accepted the estimate for <strong>${{ accepted_total }}</strong>.</p>
    <p style="margin-top: 16px; font-size: 14px;">{{ estimate.business.name }} will be in touch shortly.</p>
  </div>
</body>
</html>
