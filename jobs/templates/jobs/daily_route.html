{% extends "base.html" %}
{% block content %}
<h2>Daily Routes</h2>

<ul id="route-list">
  {% for job in jobs %}
    <li data-id="{{ job.id }}">{{ job.property.address }}</li>
  {% empty %}
    <li>No jobs for this day.</li>
  {% endfor %}
</ul>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script>
  const list = document.getElementById('route-list');

  if (list) {
    Sortable.create(list, {
      animation: 150,
      onEnd: function () {
        let order = [];
        list.querySelectorAll('li[data-id]').forEach((item, index) => {
          order.push({ id: item.dataset.id, order: index });
        });

        fetch('/jobs/routes/update/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
          },
          body: JSON.stringify(order)
        });
      }
    });
  }
</script>
{% endblock %}
