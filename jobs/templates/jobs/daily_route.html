{% extends "base.html" %}

{% block content %}
<div class="page-header">
  <h1>Daily Routes</h1>
  <p>Drag to reorder jobs for the day</p>
</div>

<div class="quick-actions" style="margin-bottom: 20px;">
  <a href="/jobs/calendar/" class="btn btn-primary">View Calendar</a>
  <a href="/" class="btn btn-secondary">Back to Dashboard</a>
</div>

<div class="card">
  <ul id="route-list" class="route-list">
    {% for job in jobs %}
    <li class="route-item" data-id="{{ job.id }}">
      <span class="route-handle">⋮⋮</span>
      <span class="route-address">{{ job.property.address }}</span>
    </li>
    {% empty %}
    <li class="route-item route-item-empty">No jobs for this day.</li>
    {% endfor %}
  </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script>
  const list = document.getElementById('route-list');

  if (list) {
    Sortable.create(list, {
      animation: 150,
      onEnd: function () {
        let order = [];
        list.querySelectorAll('li[data-id]').forEach((item, index) => {
          order.push({ id: item.dataset.id, order: index });
        });

        fetch('/jobs/routes/update/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
          },
          body: JSON.stringify(order)
        });
      }
    });
  }
</script>

<style>
  .route-list { list-style: none; padding: 0; margin: 0; }
  .route-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: grab; background: white; }
  .route-item:last-child { border-bottom: none; }
  .route-item:active { cursor: grabbing; }
  .route-handle { color: var(--text-muted); font-size: 14px; cursor: grab; }
  .route-address { font-weight: 500; flex: 1; }
  .route-item-empty { cursor: default; color: var(--text-muted); }
</style>
{% endblock %}
