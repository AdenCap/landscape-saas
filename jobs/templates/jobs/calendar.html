{% extends "base.html" %}

{% block content %}
<div class="page-header">
  <h1>Job Calendar</h1>
  <p>View and manage scheduled jobs — color-coded by crew</p>
</div>

<div class="quick-actions" style="margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
  <a href="{% url 'daily_route' %}" class="btn btn-primary">View Daily Routes</a>
  <a href="{% url 'crew_today' %}" class="btn btn-secondary">Crew Today</a>
  <a href="/" class="btn btn-secondary">Back to Dashboard</a>
  <div class="crew-legend" style="display: flex; flex-wrap: wrap; gap: 12px; margin-left: auto; align-items: center;">
    {% for item in crew_legend %}
    <span class="legend-item" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px;">
      <span class="legend-dot" style="width: 12px; height: 12px; border-radius: 4px; background: {{ item.color }};"></span>
      {{ item.name }}
    </span>
    {% endfor %}
    <span class="legend-note" style="font-size: 12px; color: var(--text-muted);">✓ = completed</span>
  </div>
</div>

<div class="card" style="padding: 20px;">
  <div id="calendar"></div>
</div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
      initialView: 'dayGridMonth',
      events: '/jobs/calendar/events/',
      eventClick: function (info) {
        var jobId = info.event.extendedProps?.jobId;
        if (jobId) {
          window.location.href = '/jobs/' + jobId + '/';
        }
      },
      eventDidMount: function (info) {
        info.el.title = (info.event.extendedProps?.crew || '') + ' — ' + (info.event.extendedProps?.status || '');
      }
    });
    calendar.render();
  });
</script>
{% endblock %}
