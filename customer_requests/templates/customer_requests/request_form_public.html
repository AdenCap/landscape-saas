<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request Service</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .form-card { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    textarea { min-height: 100px; }
    .btn { background: #22c55e; color: white; padding: 12px 24px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; width: 100%; }
    .alert { padding: 12px; border-radius: 4px; margin-bottom: 20px; }
    .alert-success { background: #d1fae5; color: #065f46; }
  </style>
</head>
<body>
  <div class="form-card">
    <h1>Request Service or Estimate</h1>
    
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-success">{{ message }}</div>
      {% endfor %}
    {% endif %}
    
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Name *</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone">
      </div>
      <div class="form-group">
        <label>Service Address *</label>
        <input type="text" name="address" required>
      </div>
      <div class="form-group">
        <label>Request Type</label>
        <select name="request_type">
          <option value="estimate">Request Estimate</option>
          <option value="service">Request Service</option>
          <option value="maintenance">Maintenance Request</option>
        </select>
      </div>
      <div class="form-group">
        <label>Service Description *</label>
        <textarea name="service_description" required></textarea>
      </div>
      <div class="form-group">
        <label>Additional Notes</label>
        <textarea name="notes"></textarea>
      </div>
      <button type="submit" class="btn">Submit Request</button>
    </form>
  </div>
</body>
</html>
