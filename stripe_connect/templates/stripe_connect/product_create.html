{% extends "base.html" %}

{% block content %}
<div class="page-header">
  <h1>Create Product</h1>
  <p>Add a new product to your storefront</p>
</div>

<div class="card" style="max-width: 600px; padding: 24px;">
  <form method="post">
    {% csrf_token %}
    
    <div class="form-group" style="margin-bottom: 20px;">
      <label for="name" style="display: block; margin-bottom: 6px; font-weight: 600;">Product Name *</label>
      <input type="text" name="name" id="name" required class="form-control" placeholder="e.g., Premium Service">
    </div>
    
    <div class="form-group" style="margin-bottom: 20px;">
      <label for="description" style="display: block; margin-bottom: 6px; font-weight: 600;">Description</label>
      <textarea name="description" id="description" rows="4" class="form-control" placeholder="Product description"></textarea>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 120px; gap: 12px; margin-bottom: 20px;">
      <div class="form-group">
        <label for="price" style="display: block; margin-bottom: 6px; font-weight: 600;">Price *</label>
        <input type="number" name="price" id="price" required step="0.01" min="0.01" class="form-control" placeholder="0.00">
      </div>
      <div class="form-group">
        <label for="currency" style="display: block; margin-bottom: 6px; font-weight: 600;">Currency</label>
        <select name="currency" id="currency" class="form-control">
          <option value="usd" selected>USD</option>
          <option value="eur">EUR</option>
          <option value="gbp">GBP</option>
          <option value="cad">CAD</option>
        </select>
      </div>
    </div>
    
    <div style="display: flex; gap: 12px;">
      <button type="submit" class="btn btn-primary">Create Product</button>
      <a href="{% url 'stripe_connect:product_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

<style>
  .form-control {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
  }
  .form-control:focus {
    outline: none;
    border-color: var(--primary);
  }
</style>
{% endblock %}
