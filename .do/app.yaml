# Digital Ocean App Platform – Supabase-backed Django app
# Build does NOT run migrate so the build phase never needs database access.
# Migrations run at runtime in the run command (DATABASE_URL is available there).

name: landscape-saas

services:
  - name: web
    dockerfile_path: Dockerfile
    run_command: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    http_port: 8080
    # In DO dashboard: on the *web* component set PG_URL = your Supabase URI, scope = Run Time.
    # Required: DJANGO_SECRET_KEY, DJANGO_DEBUG=0, ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, Stripe env vars.
    # Scheduled tasks run via DO cron jobs (Console > Jobs), not Celery.
