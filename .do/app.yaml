# Digital Ocean App Platform – Supabase-backed Django app
# Build does NOT run migrate so the build phase never needs database access.
# Migrations run at runtime in the run command (DATABASE_URL is available there).

name: landscape-saas

services:
  - name: web
    environment_slug: python
    # Do not run migrate in build – build runners may not have DATABASE_URL or network to Supabase
    build_command: pip install -r requirements.txt && python manage.py collectstatic --noinput
    run_command: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    http_port: 8080
    # In DO dashboard: on the *web* component set PG_URL = your Supabase URI, scope = Run Time. Set DJANGO_SECRET_KEY, DB_CHECK_SECRET (optional, for /api/db-check/).
