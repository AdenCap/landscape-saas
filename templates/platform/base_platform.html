<!DOCTYPE html>
<html lang="en">
<head>
  <title>{% block title %}Platform Admin{% endblock %} · Field Ops</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Platform admin: slate/indigo to distinguish from company green */
      --platform-primary: #6366f1;
      --platform-primary-hover: #4f46e5;
      --platform-primary-light: rgba(99, 102, 241, 0.15);
      --platform-surface: #0f172a;
      --platform-surface-alt: #020617;
      --platform-border: #1e293b;
      --platform-text: #f1f5f9;
      --platform-muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--platform-surface-alt);
      color: var(--platform-text);
      min-height: 100vh;
    }
    .platform-layout {
      display: flex;
      min-height: 100vh;
    }
    .platform-sidebar {
      width: 240px;
      background: var(--platform-surface);
      border-right: 1px solid var(--platform-border);
      padding: 20px 0;
      flex-shrink: 0;
    }
    .platform-sidebar .brand {
      font-size: 18px;
      font-weight: 700;
      color: var(--platform-primary);
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--platform-border);
      margin-bottom: 16px;
    }
    .platform-sidebar .brand span { color: var(--platform-muted); font-weight: 500; font-size: 14px; }
    .platform-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .platform-nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      color: var(--platform-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-radius: 0;
      border-left: 3px solid transparent;
      transition: color 0.15s, background 0.15s;
    }
    .platform-nav a:hover {
      color: var(--platform-text);
      background: var(--platform-primary-light);
    }
    .platform-nav a.active {
      color: var(--platform-primary);
      background: var(--platform-primary-light);
      border-left-color: var(--platform-primary);
    }
    .platform-nav .divider {
      height: 1px;
      background: var(--platform-border);
      margin: 12px 20px;
    }
    .platform-nav-logout {
      display: block;
      margin: 0;
      padding: 0;
    }
    .platform-nav-logout button {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      color: var(--platform-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-left: 3px solid transparent;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
      text-align: left;
      transition: color 0.15s, background 0.15s;
    }
    .platform-nav-logout button:hover {
      color: var(--platform-text);
      background: var(--platform-primary-light);
    }
    .platform-main {
      flex: 1;
      padding: 32px;
      min-width: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--platform-primary);
      color: white;
    }
    .btn-primary:hover { background: var(--platform-primary-hover); color: white; }
    .btn-secondary {
      background: var(--platform-surface);
      color: var(--platform-text);
      border: 1px solid var(--platform-border);
    }
    .btn-secondary:hover { border-color: var(--platform-primary); color: var(--platform-primary); }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .card {
      background: var(--platform-surface);
      border: 1px solid var(--platform-border);
      border-radius: 14px;
      padding: 20px;
    }
    .card-title { font-size: 16px; font-weight: 600; margin: 0 0 16px 0; color: var(--platform-text); }
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--platform-border); }
    .data-table th { font-size: 12px; color: var(--platform-muted); font-weight: 600; }
    .link-primary { color: var(--platform-primary); text-decoration: none; font-weight: 500; }
    .link-primary:hover { text-decoration: underline; }
    .messages { margin-bottom: 20px; }
    .alert { padding: 12px 16px; border-radius: 10px; font-size: 14px; }
    .alert-success { background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
    .alert-info { background: var(--platform-primary-light); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.4); }
    .alert-error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    @media (max-width: 768px) {
      .platform-layout { flex-direction: column; }
      .platform-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--platform-border); }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="platform-layout">
    <aside class="platform-sidebar">
      <div class="brand">Platform <span>Admin</span></div>
      <nav class="platform-nav">
        <a href="{% url 'platform_home' %}" class="{% if request.path == '/platform/' or request.path == '/platform' %}active{% endif %}">Dashboard</a>
        <a href="{% url 'admin:index' %}" target="_blank" rel="noopener">Django Admin</a>
        <div class="divider"></div>
        <a href="/">Open app (company view)</a>
        <form action="{% url 'logout' %}" method="post" class="platform-nav-logout">
          {% csrf_token %}
          <button type="submit">Logout</button>
        </form>
      </nav>
    </aside>
    <main class="platform-main">
      {% if messages %}
      <div class="messages">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block extra_js %}{% endblock %}
</body>
</html>
