<!-- Quick Add Client Modal — include on any page with a customer selector -->
<div id="quick-add-client-modal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;">
  <div style="background:var(--surface,#1a1a1a);border:1px solid var(--border,#333);border-radius:12px;padding:24px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="margin:0;font-size:16px;font-weight:700;">Add New Client</h3>
      <button type="button" onclick="document.getElementById('quick-add-client-modal').style.display='none'" style="background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;">&times;</button>
    </div>
    <div class="qa-field">
      <label>Name *</label>
      <input type="text" id="qa-client-name" placeholder="Client name" required>
    </div>
    <div class="qa-row-grid">
      <div class="qa-field">
        <label>Email</label>
        <input type="email" id="qa-client-email" placeholder="email@example.com">
      </div>
      <div class="qa-field">
        <label>Phone</label>
        <input type="tel" id="qa-client-phone" placeholder="(555) 123-4567">
      </div>
    </div>
    <div class="qa-field">
      <label>Address</label>
      <input type="text" id="qa-client-address" placeholder="Start typing an address..." autocomplete="off">
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button type="button" id="qa-client-save" class="btn btn-primary" style="flex:1;">Add Client</button>
      <button type="button" onclick="document.getElementById('quick-add-client-modal').style.display='none'" class="btn btn-secondary" style="flex:1;">Cancel</button>
    </div>
    <div id="qa-client-error" style="display:none;margin-top:8px;padding:8px;background:rgba(255,100,100,0.1);border-radius:6px;font-size:12px;color:#f87171;"></div>
  </div>
</div>

<!-- Quick Add Property Modal — include on any page with a property selector -->
<div id="quick-add-property-modal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;">
  <div style="background:var(--surface,#1a1a1a);border:1px solid var(--border,#333);border-radius:12px;padding:24px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="margin:0;font-size:16px;font-weight:700;">Add Property</h3>
      <button type="button" onclick="document.getElementById('quick-add-property-modal').style.display='none'" style="background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;">&times;</button>
    </div>
    <input type="hidden" id="qa-prop-customer-id">
    <div class="qa-field">
      <label>Property Address *</label>
      <input type="text" id="qa-prop-address" placeholder="Start typing an address..." autocomplete="off">
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button type="button" id="qa-prop-save" class="btn btn-primary" style="flex:1;">Add Property</button>
      <button type="button" onclick="document.getElementById('quick-add-property-modal').style.display='none'" class="btn btn-secondary" style="flex:1;">Cancel</button>
    </div>
    <div id="qa-prop-error" style="display:none;margin-top:8px;padding:8px;background:rgba(255,100,100,0.1);border-radius:6px;font-size:12px;color:#f87171;"></div>
  </div>
</div>

<style>
  .qa-field { margin-bottom:12px; }
  .qa-field label { display:block;font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.05em; }
  .qa-field input, .qa-field select { width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg,#111);color:var(--text,#fff);font-size:14px;font-family:inherit;box-sizing:border-box; }
  .qa-field input:focus, .qa-field select:focus { outline:none;border-color:var(--primary); }
  .qa-row-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
  .qa-field input:focus { scroll-margin-bottom:200px; }
  @media (max-width:768px) {
    .qa-field input, .qa-field select { font-size:16px;min-height:44px; }
    /* Full-screen scrollable on mobile so keyboard doesn't hide fields */
    #quick-add-client-modal, #quick-add-property-modal {
      align-items:flex-end !important;
    }
    #quick-add-client-modal > div, #quick-add-property-modal > div {
      max-width:100% !important;
      width:100% !important;
      max-height:100vh;
      max-height:100dvh;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      border-radius:16px 16px 0 0 !important;
      padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
    }
    /* Email/phone stacked on mobile */
    .qa-row-grid { grid-template-columns:1fr; }
  }
</style>

<script>
(function() {
  function getCSRFToken() {
    var el = document.querySelector('[name=csrfmiddlewaretoken]');
    if (el && el.value) return el.value;
    var match = document.cookie.match(/csrftoken=([^;]+)/);
    return match ? decodeURIComponent(match[1]) : '';
  }

  // Close modals on backdrop click
  ['quick-add-client-modal', 'quick-add-property-modal'].forEach(function(id) {
    var modal = document.getElementById(id);
    if (modal) modal.addEventListener('click', function(e) { if (e.target === modal) modal.style.display = 'none'; });
  });

  // ── Quick Add Client ──
  var clientSaveBtn = document.getElementById('qa-client-save');
  if (clientSaveBtn) {
    clientSaveBtn.addEventListener('click', function() {
      var name = document.getElementById('qa-client-name').value.trim();
      var email = document.getElementById('qa-client-email').value.trim();
      var phone = document.getElementById('qa-client-phone').value.trim();
      var address = document.getElementById('qa-client-address').value.trim();
      var errorEl = document.getElementById('qa-client-error');

      if (!name) { errorEl.textContent = 'Name is required.'; errorEl.style.display = ''; return; }
      errorEl.style.display = 'none';
      clientSaveBtn.disabled = true;
      clientSaveBtn.textContent = 'Creating...';

      fetch('/clients/api/quick-create-customer/', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRFToken() },
        body: JSON.stringify({ name: name, email: email, phone: phone, address: address })
      }).then(function(r) { return r.json(); }).then(function(data) {
        clientSaveBtn.disabled = false;
        clientSaveBtn.textContent = 'Add Client';
        if (data.ok) {
          document.getElementById('quick-add-client-modal').style.display = 'none';
          // Dispatch event so the page can update its customer selector
          window.dispatchEvent(new CustomEvent('quickClientCreated', { detail: data }));
          // Clear form
          document.getElementById('qa-client-name').value = '';
          document.getElementById('qa-client-email').value = '';
          document.getElementById('qa-client-phone').value = '';
          document.getElementById('qa-client-address').value = '';
        } else {
          errorEl.textContent = data.error || 'Failed to create client.';
          errorEl.style.display = '';
        }
      }).catch(function() {
        clientSaveBtn.disabled = false;
        clientSaveBtn.textContent = 'Add Client';
        errorEl.textContent = 'Network error.';
        errorEl.style.display = '';
      });
    });
  }

  // ── Quick Add Property ──
  var propSaveBtn = document.getElementById('qa-prop-save');
  if (propSaveBtn) {
    propSaveBtn.addEventListener('click', function() {
      var customerId = document.getElementById('qa-prop-customer-id').value;
      var address = document.getElementById('qa-prop-address').value.trim();
      var errorEl = document.getElementById('qa-prop-error');

      if (!address) { errorEl.textContent = 'Address is required.'; errorEl.style.display = ''; return; }
      if (!customerId) { errorEl.textContent = 'Select a customer first.'; errorEl.style.display = ''; return; }
      errorEl.style.display = 'none';
      propSaveBtn.disabled = true;
      propSaveBtn.textContent = 'Creating...';

      fetch('/clients/api/quick-create-property/', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRFToken() },
        body: JSON.stringify({ customer_id: parseInt(customerId), address: address })
      }).then(function(r) { return r.json(); }).then(function(data) {
        propSaveBtn.disabled = false;
        propSaveBtn.textContent = 'Add Property';
        if (data.ok) {
          document.getElementById('quick-add-property-modal').style.display = 'none';
          window.dispatchEvent(new CustomEvent('quickPropertyCreated', { detail: data }));
          document.getElementById('qa-prop-address').value = '';
        } else {
          errorEl.textContent = data.error || 'Failed to create property.';
          errorEl.style.display = '';
        }
      }).catch(function() {
        propSaveBtn.disabled = false;
        propSaveBtn.textContent = 'Add Property';
        errorEl.textContent = 'Network error.';
        errorEl.style.display = '';
      });
    });
  }

  // Global helper functions for opening modals
  window.openQuickAddClient = function() {
    document.getElementById('quick-add-client-modal').style.display = 'flex';
    document.getElementById('qa-client-name').focus();
  };
  window.openQuickAddProperty = function(customerId) {
    document.getElementById('qa-prop-customer-id').value = customerId || '';
    document.getElementById('quick-add-property-modal').style.display = 'flex';
    document.getElementById('qa-prop-address').focus();
  };
})();
</script>

{% if google_maps_api_key %}
<script>
function initQuickAddAutocomplete() {
  var opts = { types: ['address'], componentRestrictions: { country: 'us' } };

  // Client address autocomplete
  var clientAddr = document.getElementById('qa-client-address');
  if (clientAddr && google.maps.places) {
    var ac1 = new google.maps.places.Autocomplete(clientAddr, opts);
    ac1.addListener('place_changed', function() {
      var place = ac1.getPlace();
      if (place && place.formatted_address) {
        clientAddr.value = place.formatted_address;
      }
    });
    // Prevent form submit on Enter when autocomplete dropdown is open
    clientAddr.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var pac = document.querySelector('.pac-container');
        if (pac && pac.style.display !== 'none') e.preventDefault();
      }
    });
  }

  // Property address autocomplete
  var propAddr = document.getElementById('qa-prop-address');
  if (propAddr && google.maps.places) {
    var ac2 = new google.maps.places.Autocomplete(propAddr, opts);
    ac2.addListener('place_changed', function() {
      var place = ac2.getPlace();
      if (place && place.formatted_address) {
        propAddr.value = place.formatted_address;
      }
    });
    propAddr.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var pac = document.querySelector('.pac-container');
        if (pac && pac.style.display !== 'none') e.preventDefault();
      }
    });
  }
}

// Load Google Maps Places if not already loaded
if (typeof google !== 'undefined' && google.maps && google.maps.places) {
  initQuickAddAutocomplete();
} else {
  // Check if script is already loading (from another page)
  var existing = document.querySelector('script[src*="maps.googleapis.com/maps/api/js"]');
  if (!existing) {
    var s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&libraries=places&callback=initQuickAddAutocomplete';
    s.async = true;
    s.defer = true;
    document.body.appendChild(s);
  } else {
    // Script already loading from another template — wait for it
    var checkInterval = setInterval(function() {
      if (typeof google !== 'undefined' && google.maps && google.maps.places) {
        clearInterval(checkInterval);
        initQuickAddAutocomplete();
      }
    }, 200);
    setTimeout(function() { clearInterval(checkInterval); }, 10000); // Safety timeout
  }
}
</script>
<style>
  /* Ensure Google Places dropdown shows above modals */
  .pac-container { z-index: 10001 !important; }
</style>
{% endif %}
