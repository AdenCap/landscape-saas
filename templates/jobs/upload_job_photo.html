{% extends "base.html" %}

{% block content %}
<div class="page-header">
  <h1>Site Photo</h1>
  <p>{{ job.property.address }}</p>
</div>

<div class="card">
  <form method="post" action="" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
      <label>Category</label>
      <div class="category-radios">
        <label class="cat-radio"><input type="radio" name="category" value="before"> Before</label>
        <label class="cat-radio"><input type="radio" name="category" value="during"> During</label>
        <label class="cat-radio"><input type="radio" name="category" value="after"> After</label>
        <label class="cat-radio"><input type="radio" name="category" value="issue"> Issue</label>
        <label class="cat-radio"><input type="radio" name="category" value="general" checked> General</label>
      </div>
    </div>
    <div class="form-group">
      <label for="id_photo">Photo *</label>
      <input type="file" name="photo" id="id_photo" accept="image/*" capture="environment">
    </div>
    <div class="form-group">
      <label for="id_caption">Caption (optional)</label>
      <input type="text" name="caption" id="id_caption" maxlength="255" placeholder="Brief description..."
        style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface-alt); color:var(--text); font-size:14px;">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" style="min-height:44px; flex:1;">Upload Photo</button>
      {% if request.user.role == "owner" or request.user.role == "manager" %}
      <a href="{% url 'job_detail' job.id %}" class="btn btn-secondary" style="min-height:44px;">Cancel</a>
      {% else %}
      <a href="{% url 'crew_today' %}" class="btn btn-secondary" style="min-height:44px;">Cancel</a>
      {% endif %}
    </div>
  </form>
</div>

<style>
  .form-group { margin-bottom: 16px; }
  .form-group > label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
  .form-actions { display: flex; gap: 12px; margin-top: 20px; }
  .category-radios { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat-radio {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-alt);
    font-size: 14px; cursor: pointer; min-height: 44px;
  }
  .cat-radio:has(input:checked) {
    border-color: var(--primary); background: var(--primary-light, rgba(16,185,129,0.1));
  }
  .cat-radio input[type="radio"] { margin: 0; }
</style>
{% endblock %}
