<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong – FIELDLGX</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --surface: #0a0a0a; --text: #fafafa; --text-muted: #a3a3a3; --primary: #22c55e; --border: #262626; }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--surface); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .error-card { text-align: center; max-width: 440px; }
    .error-code { font-size: 96px; font-weight: 700; background: linear-gradient(135deg, #4ade80, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; margin-bottom: 16px; }
    .error-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .error-desc { color: var(--text-muted); font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
    .error-link { display: inline-block; padding: 12px 28px; background: var(--primary); color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 14px; transition: background 0.15s; }
    .error-link:hover { background: #16a34a; }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">500</div>
    <div class="error-title">Something went wrong</div>
    <p class="error-desc">We hit an unexpected error. Please try again in a moment. If this keeps happening, contact support.</p>
    <a href="/" class="error-link">Back to dashboard</a>
  </div>
</body>
</html>
