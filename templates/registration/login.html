{% extends "base.html" %}

{% block title %}Login - Field Ops{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 48px auto;">
  <div class="card" style="padding: 32px;">
    <h1 style="font-size: 24px; font-weight: 700; margin: 0 0 8px 0;">Sign in</h1>
    <p style="color: var(--text-muted); margin: 0 0 24px 0;">Log in to access the dashboard.</p>

    {% if form.errors %}
    <p style="color: #fca5a5; margin-bottom: 16px; font-size: 14px;">
      Invalid username or password. Please try again.
    </p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}" />

      <div style="margin-bottom: 16px;">
        <label for="id_username" style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;">Username</label>
        <input type="text" name="username" id="id_username" required autofocus
          style="width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px;"
          placeholder="Enter your username">
      </div>

      <div style="margin-bottom: 24px;">
        <label for="id_password" style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;">Password</label>
        <input type="password" name="password" id="id_password" required
          style="width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px;"
          placeholder="Enter your password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
        Sign in
      </button>
    </form>

    <p style="margin-top: 24px; text-align: center; color: var(--text-muted); font-size: 14px;">
      Don’t have an account? <a href="{% url 'signup' %}" style="color: var(--primary); font-weight: 500;">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
