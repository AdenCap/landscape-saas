{% load socialaccount %}
<div style="display:grid;gap:10px;margin-bottom:18px;">
  <a href="{% provider_login_url 'google' %}" class="social-btn" style="background:#fff;color:#333;">
    <svg width="18" height="18" viewBox="0 0 48 48" style="flex-shrink:0;">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.0 24.0 0 0 0 0 21.56l7.98-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Continue with Google
  </a>
  <a href="{% provider_login_url 'apple' %}" class="social-btn" style="background:#000;color:#fff;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" style="flex-shrink:0;">
      <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.52-3.23 0-1.44.65-2.2.46-3.06-.4C3.79 16.17 4.36 9.02 8.8 8.78c1.27.06 2.15.72 2.91.76.99-.2 1.94-.78 3-.84 1.28-.08 2.24.47 2.87 1.42-2.63 1.58-2.01 5.07.37 6.04-.5 1.3-.87 1.88-1.9 3.12zM12.03 8.7c-.14-2.38 1.82-4.42 4.12-4.6.33 2.77-2.48 4.83-4.12 4.6z"/>
    </svg>
    Continue with Apple
  </a>
</div>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
  <div style="flex:1;height:1px;background:var(--border);"></div>
  <span style="font-size:13px;color:var(--muted);white-space:nowrap;">{{ divider_text }}</span>
  <div style="flex:1;height:1px;background:var(--border);"></div>
</div>
<style>
.social-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:10px;border:1px solid var(--border);font-size:15px;font-weight:500;text-decoration:none;transition:all .2s ease;cursor:pointer}
.social-btn:hover{opacity:.85;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
</style>
