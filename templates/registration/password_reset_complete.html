{% extends "base.html" %}

{% block title %}Password reset complete - Tradevo{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 48px auto;">
  <div class="card" style="padding: 32px;">
    <h1 style="font-size: 24px; font-weight: 700; margin: 0 0 8px 0;">Password reset complete</h1>
    <p style="color: var(--text-muted); margin: 0 0 24px 0;">Your password has been set. You can sign in with your new password now.</p>

    <p style="text-align: center;">
      <a href="{% url 'login' %}" class="btn btn-primary" style="display: inline-block; padding: 12px 24px;">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
