{% extends "base.html" %}

{% block content %}
<div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;">
  <div>
    <h1>Save Card for {{ customer.name }}</h1>
    <p>Card details are securely stored by Stripe. We never see or store the full card number.</p>
  </div>
  <a href="{% url 'customer_detail' customer.id %}" class="btn btn-secondary">&larr; Back</a>
</div>

<div class="card" style="max-width:500px;">
  <label style="display:block;font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;">Card Details</label>
  <div id="card-element" style="padding:14px 16px;border:2px solid var(--border);border-radius:10px;background:var(--surface-lowest);margin-bottom:16px;min-height:44px;"></div>
  <div id="card-errors" style="color:var(--danger-text);font-size:13px;margin-bottom:12px;display:none;"></div>
  <button type="button" id="save-btn" style="width:100%;padding:14px 20px;font-size:16px;font-weight:700;font-family:var(--font-headline);border:none;border-radius:10px;cursor:pointer;background:var(--primary);color:#111;letter-spacing:0.03em;transition:all 0.15s;">
    <span class="material-symbols-outlined" style="font-size:20px;vertical-align:-4px;margin-right:6px;">lock</span>
    Save Card Securely
  </button>
  <p style="font-size:11px;color:var(--text-muted);margin:12px 0 0;text-align:center;">
    <span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px;margin-right:2px;">verified_user</span>
    Secured by Stripe. Card data is encrypted and never stored on our servers.
  </p>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
(function() {
  var stripe = Stripe('{{ stripe_publishable_key }}', {
    stripeAccount: '{{ stripe_account_id }}'
  });
  var isLightTheme = document.documentElement.classList.contains('theme-light-effective') || document.documentElement.getAttribute('data-theme') === 'light';
  var elements = stripe.elements({
    appearance: {
      theme: isLightTheme ? 'stripe' : 'night',
      variables: {
        colorPrimary: isLightTheme ? '#22c55e' : '#9dd850',
        colorBackground: isLightTheme ? '#ffffff' : '#131313',
        colorText: isLightTheme ? '#111111' : '#e5e2e1',
        colorDanger: '#f87171',
        borderRadius: '8px',
      }
    }
  });
  var cardElement = elements.create('card', {
    style: {
      base: { fontSize: '16px', color: isLightTheme ? '#111111' : '#e5e2e1' },
      invalid: { color: '#f87171' }
    }
  });
  cardElement.mount('#card-element');

  var errEl = document.getElementById('card-errors');
  cardElement.on('change', function(event) {
    if (event.error) {
      errEl.textContent = event.error.message;
      errEl.style.display = '';
    } else {
      errEl.style.display = 'none';
    }
  });

  document.getElementById('save-btn').addEventListener('click', function() {
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Saving...';

    stripe.confirmCardSetup('{{ client_secret }}', {
      payment_method: { card: cardElement }
    }).then(function(result) {
      if (result.error) {
        errEl.textContent = result.error.message;
        errEl.style.display = '';
        btn.disabled = false;
        btn.textContent = 'Save Card';
      } else {
        // Save the payment method ID to our server
        fetch('{% url "customer_save_card" customer.id %}', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
          },
          body: JSON.stringify({
            payment_method_id: result.setupIntent.payment_method
          })
        }).then(function(r) { return r.json(); }).then(function(data) {
          if (data.ok) {
            btn.textContent = 'Card Saved!';
            btn.style.background = 'var(--primary)';
            setTimeout(function() {
              window.location.href = '{% url "customer_detail" customer.id %}';
            }, 1000);
          } else {
            errEl.textContent = data.error || 'Failed to save card.';
            errEl.style.display = '';
            btn.disabled = false;
            btn.textContent = 'Save Card';
          }
        });
      }
    });
  });
})();
</script>
{% endblock %}
